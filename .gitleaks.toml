j# Gitleaks Configuration for Odyssey Monorepo
title = "Gitleaks secret scanning config"

[allowlist]
description = "Allowed placeholder test strings and documentation examples"
regexes = [
  '''local-development-secret''',
  '''sk_test_...''',
  '''pk_test_...''',
  '''re_123456789''',
  '''password123''',
]
paths = [
  '''\.env\.example''',
  '''README\.md''',
  '''docs/.*''',
]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|secret[_-]?key|auth[_-]?token)\s*[:=]\s*["']([0-9a-zA-Z_\-]{16,})["']'''

[[rules]]
id = "postgres-connection-string"
description = "PostgreSQL connection string with credentials"
regex = '''postgres(ql)?://[a-zA-Z0-9_\-]+:[^@\s]+@[a-zA-Z0-9_\-\.]+:[0-9]+/[a-zA-Z0-9_\-]+'''
